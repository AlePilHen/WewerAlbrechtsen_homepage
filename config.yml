# ------------------------------------------------------------------
# Dashboard configuration. Edit this file; the page rebuilds daily.
# ------------------------------------------------------------------

group:
  name: Wewer Albrechtsen Group
  subtitle: Clinical Biochemistry · Bispebjerg Hospital
  # ORCIDs of group members. Used for "Latest publication" and the
  # papers-per-year chart (looked up in Europe PMC).
  # While this list is empty, the page shows an example paper.
  orcids:
    - "0000-0003-4230-5753"  # Nicolai
    - "0000-0003-2144-1385"  # Marie
    - "0009-0005-2855-208X"  # Annelaura
    - "0000-0003-4000-5669"  # Sasha
    - "0009-0006-2200-8099"  # Jesper
    - "0009-0005-4575-2593"  # Alexander

  # Optional extra search for members without an ORCID (Europe PMC syntax), e.g.
  # extra_query: 'AUTH:"Wewer Albrechtsen NJ"'
  # This only searches PubMed (via Europe PMC); OpenAlex is searched by ORCID only.
  extra_query: ""
  # OpenAlex needs a free API key. Do NOT put it in this file (it is public):
  # store it as the GitHub secret OPENALEX_API_KEY (see the README).

# ------------------------------------------------------------------
# Journal lists. Names must match the NLM abbreviation that
# Europe PMC uses (search the journal in PubMed's NLM Catalog if unsure).
# ------------------------------------------------------------------
journals:
  top_tier:
    - N Engl J Med
    - Lancet
    - JAMA
    - BMJ
    - Nature
    - Science
    - Cell
    - Nat Med
    - Lancet Diabetes Endocrinol
    - Cell Metab
    - Nat Metab
    - Proc Natl Acad Sci U S A
  key_field:
    - Diabetes
    - Diabetes Care
    - Diabetologia
    - Diabetes Obes Metab
    - J Clin Endocrinol Metab
    - J Hepatol
    - Hepatology
    - Gastroenterology
    - Mol Cell Proteomics
    - J Proteome Res
    - Clin Chem
    - Circulation
    - Eur Heart J

# ------------------------------------------------------------------
# New papers. Each widget has tabs; each tab is one search.
#
#   all_of:   a list of term groups. A paper must match at least one
#             term from EVERY group (in title or abstract).
#   none_of:  terms that exclude a paper.
#   fields:   where to look: [TITLE, ABSTRACT] (default) or [TITLE].
#   journals: any  -> all journals and preprints
#             key  -> only journals in the two lists above
#   window_days, limit: optional per-tab overrides.
#   query:    instead of all_of, a raw Europe PMC query
#             (https://europepmc.org/searchsyntax).
# ------------------------------------------------------------------
window_days: 21
limit: 20

paper_widgets:
  - title: Biomarkers & proteomics
    tabs:
      - label: Plasma proteomics
        all_of:
          - [proteomics, proteome, proteomic, Olink, SomaScan, "mass spectrometry", "affinity proteomics"]
          - [diabetes, obesity, "insulin resistance", MASLD, MASH, NAFLD, "fatty liver", steatosis, cardiometabolic, "metabolic syndrome"]
        journals: key

      - label: Liver disease biomarkers
        all_of:
          - [MASLD, MASH, NAFLD, NASH, MetALD, "fatty liver", "steatotic liver", "liver fibrosis"]
          - [biomarker, biomarkers, "non-invasive", noninvasive, "diagnostic accuracy", "risk score", proteomic, proteomics, "circulating"]
        journals: any

      - label: Hormone assays & methods
        all_of:
          - [glucagon, "GLP-1", "glucagon-like peptide", GIP, oxyntomodulin, "C-peptide", incretin, "amino acids"]
          - [assay, immunoassay, ELISA, "LC-MS/MS", "LC-MS", "mass spectrometry", "analytical validation", "method comparison", "interlaboratory"]
        journals: any

  - title: Metabolism & treatment
    tabs:
      - label: Glucagon & liver–alpha cell axis
        fields: [TITLE]
        all_of:
          - [glucagon, GCGR, "alpha cell", "alpha cells", "alpha-cell", "α-cell", "α-cells", hyperglucagonemia, hyperglucagonaemia, "liver-alpha cell axis"]
        none_of: ["glucagon-like peptide-1", "glucagon-like peptide 1"]
        journals: any

      - label: Incretin & multi-agonist drugs
        all_of:
          - [semaglutide, tirzepatide, retatrutide, survodutide, mazdutide, cagrilintide, CagriSema, orforglipron, liraglutide, dulaglutide,
             "GLP-1 receptor agonist", "GLP-1 receptor agonists", "GLP-1RA", "dual agonist", "triple agonist", "co-agonist", amylin]
        journals: key

      - label: MASLD/MASH
        all_of:
          - [MASLD, MASH, NAFLD, NASH, MetALD, "steatotic liver disease", "fatty liver", steatohepatitis]
        journals: key

      - label: GDF15
        all_of:
          - [GDF15, "GDF-15", "growth differentiation factor 15", GFRAL]
        journals: any
        window_days: 30

      - label: Murine models
        all_of:
          - [mice, mouse, murine, rat, rats, rodent]
          - [diabetes, diabetic, obesity, obese, "insulin resistance", MASLD, MASH, NAFLD, "fatty liver", glucagon, "beta cell", "β-cell", islet]
        journals: key

      - label: Clinical trials & epidemiology
        all_of:
          - [randomized, randomised, "randomized controlled trial", cohort, "population-based", registry, "Mendelian randomization", "meta-analysis", epidemiology, epidemiological]
          - [diabetes, "type 1 diabetes", "type 2 diabetes", "gestational diabetes", GDM, "cardiovascular disease", "cardiovascular outcomes", "heart failure", "myocardial infarction", stroke]
        journals: key
        window_days: 30

# ------------------------------------------------------------------
# News (any RSS or Atom feed)
#
#   fetch_images: true  -> for items where the feed has no image, open each
#                          article page and use its preview image. Makes the
#                          build a bit slower (about 1 s per item).
#   logo: <image URL>   -> shown when an item has no image. If left out, the
#                          feed's own logo is used when it has one; otherwise
#                          the source name is shown.
#   exclude_types: [..] -> leave out these article types, read from each article
#                          page (e.g. Correspondence, Editorial, Comment).
#   include_types: [..] -> the opposite: keep ONLY these article types.
#   exclude_titles: [..]-> leave out items whose title matches (regular
#                          expressions), e.g. "^STAT\\+:" for paywalled STAT+ stories.
# Images are shown straight from the publishers' sites, not copied.
# ------------------------------------------------------------------
news:
  - label: Nature
    url: https://www.nature.com/nature.rss
    limit: 10
    fetch_images: true
    exclude_types: [Correspondence]
    exclude_titles: ["^Author Correction", "^Publisher Correction"]
    logo: https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ13GXzPPsGsd18oo-u3MlKBjG37dPlnAFN7OhbH_Rc5w&s=10
  - label: Science
    url: https://www.science.org/rss/news_current.xml
    limit: 15
    fetch_images: true
    exclude_titles: ["^Author Correction", "^Publisher Correction"]
    logo: https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRrKXhWHzN2vtlMzenPK-RVMc0nZRe-AnFBWpNRKbStJQ&s=10
  - label: Knowable
    url: https://knowablemagazine.org/rss
    limit: 10
  - label: eLife Magazine
    url: https://elifesciences.org/rss/magazine.xml
    limit: 10
    # eLife's feed has no logo; paste a logo image URL here if you want one:
    logo: https://upload.wikimedia.org/wikipedia/commons/5/50/Elife-logo-2020.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail_unscaled&_=20200316134344
  - label: Retraction Watch
    url: https://retractionwatch.com/feed/
    limit: 10

# ------------------------------------------------------------------
# Daily boxes (right column)
# ------------------------------------------------------------------
daily:
  target_of_the_day: false     # approved drug targets (ChEMBL + UniProt)
  spotlight_feed: https://www.proteinspotlight.org/spotlight/rss/index.xml
  owid_feed: https://ourworldindata.org/atom-data-insights.xml
  motm_feed: https://pdb101.rcsb.org/motm/rss.xml

# ------------------------------------------------------------------
# Coming up: courses, events and conferences (left column)
#
# Rules: an event disappears once it has ended, when registration is
# closed, or 7 days after its registration deadline. A course or event
# without a known deadline disappears 10 days before it starts.
# Courses and events are shown up to window_days ahead (or while their
# deadline is within that window); conferences up to conference_window_days.
# Keywords: "metabol*" matches metabolism, metabolic, ...; words in
# CAPITALS (like AI) only match exactly.
# ------------------------------------------------------------------
events:
  window_days: 120
  conference_window_days: 365
  hide_days_after_deadline: 7
  hide_days_before_start_without_deadline: 10   # courses/events (not conferences) with no known deadline
  urgent_days: 14          # deadlines closer than this are highlighted
  show: 6                  # shown before "Show all"

  # Courses from DDSA and TeSS containing one of these words are left out
  exclude_words: [music*, humanities, social science*, Fundamentals of the PhD education]

  # Hide individual events: part of the title or the link (not case-sensitive)
  hide: []

  ddsa:                    # Danish Data Science Academy (events API)
    categories: [DDSA-Organised Event, DDSA-Funded Event]
    course_category: PhD Course
    course_tags: [Bioinformatics, Biostatistics]
    # PhD courses must also mention one of these in the title or description
    course_topic_words: [biomed*, clinical, health, medic*, omics, proteom*, protein*, metabol*, diabet*,
                         genom*, genetic*, statistic*, biostatistic*, bioinformatic*, epidemiolog*]
    # When DDSA only re-posts an event, the dashboard links to the original page, and the
    # deadline is looked up there for these sites:
    follow_links_to: [ddeacademy.dk, phdcourses.dk]

  science_cluster:         # NNF Science Cluster (event pages)
    keywords: [metabol*, diabet*, obesity, endocrin*, liver, protein*, proteom*, genom*, genetic*, data, AI, health]

  ddea:                    # Danish Diabetes and Endocrine Academy (event pages)
    enabled: true          # skipped automatically if the site forbids automated reading

  tess:                    # ELIXIR TeSS training register
    keywords: [proteomics, mass spectrometry, metabolomics, metabolism, diabetes, endocrinology,
               obesity, biomarker, liver, health data, biostatistics, protein, UniProt, variant effect, omics]
    in_person_countries: [Denmark, Sweden, Norway, Finland, Iceland]   # online courses: any country
    # In-person courses from these are shown wherever they are held (EMBL-EBI, EMBL Heidelberg).
    # Their application deadline is read from the course page.
    trusted_providers: [ebi.ac.uk, embl.org]

  # Conferences: list each series once. Use {year} where the address contains the year;
  # otherwise give a page that always lists the next meeting(s).
  # one_day: true  -> for meetings that last a single day.
  conferences:
    - {name: EASD Annual Meeting, url: "https://www.easd.org/annual-meeting/easd-{year}/"}
    - {name: EASL Congress, url: "https://easl.eu/event/easl-congress-{year}/"}
    - {name: European Congress of Endocrinology (ECE), url: "https://www.ese-hormones.org/education-and-training/events-key-dates/european-congress-of-endocrinology-ece-{year}/"}
    - {name: HUPO World Congress, url: "https://{year}.hupo.org/"}
    - {name: ESHG Conference, url: "https://eshg.org/conferences/future-eshg-meetings"}
    - {name: ADA Scientific Sessions, url: "https://professional.diabetes.org/scientific-sessions"}
    - {name: ENDO, url: "https://endocrine.org/meetings-and-events/endo-future-meetings"}
    - {name: ASMS Conference, url: "https://www.asms.org/conferences/annual-conference/future-annual-conferences"}
    - {name: DAPSOC Symposium, url: "https://dapsoc.org/events/", one_day: true}
    - {name: Metabolism Day (KU), url: "https://healthsciences.ku.dk/calender/calender-{year}/metabolism-day-{year}/", one_day: true}



